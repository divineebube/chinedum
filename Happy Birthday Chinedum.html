<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Happy Birthday Chinedum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Outfit:wght@300;500;700&display=swap">
<style>
/* Layout: one full-screen stage — canvas sky behind, centred title block, rotating wish line, auto-hiding controls */
:root{
  --night:#0b1026;
  --night-2:#1a1446;
  --gold:#f5c451;
  --coral:#ff6b6b;
  --mint:#5ee6c8;
  --ink:#f4f1ff;
  --muted:#b9b3dd;
  --display:"Abril Fatface", "Playfair Display", Georgia, serif;
  --body:"Outfit", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:radial-gradient(120% 90% at 50% 110%, var(--night-2) 0%, var(--night) 60%);
  background-color:var(--night);
  color:var(--ink);font-family:var(--body);overflow:hidden;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.stage{
  position:relative;z-index:2;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;
  text-align:center;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:4vh;
}
.eyebrow{
  font-weight:500;letter-spacing:.42em;text-transform:uppercase;
  font-size:clamp(12px,1.6vw,26px);color:var(--mint);
  animation:rise 1.2s .2s both;
}
.hb{
  font-family:var(--display);font-weight:400;line-height:.92;margin:0;
  font-size:clamp(52px,11vw,210px);text-wrap:balance;
  background:linear-gradient(100deg,var(--gold) 0%,#fff3c4 30%,var(--gold) 50%,var(--coral) 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise 1.2s .4s both, shimmer 7s linear infinite;
  filter:drop-shadow(0 6px 30px rgba(245,196,81,.25));
}
.name{
  font-family:var(--display);font-size:clamp(34px,5.6vw,112px);line-height:1.05;margin:0;text-wrap:balance;max-width:92vw;
  color:var(--ink);outline:none;border-radius:12px;padding:0 .2em;
  animation:rise 1.2s .7s both;min-width:2ch;
}
.name:focus-visible,.from:focus-visible{box-shadow:0 0 0 3px var(--mint)}
.rule{width:min(240px,40vw);height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:rise 1.2s .9s both}
.wish{
  font-weight:300;font-size:clamp(16px,2.4vw,42px);color:var(--muted);
  max-width:28ch;min-height:2.6em;text-wrap:balance;
  transition:opacity .9s ease, transform .9s ease;
}
.wish.out{opacity:0;transform:translateY(12px)}
.from{
  font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  font-size:clamp(11px,1.2vw,20px);color:var(--gold);outline:none;border-radius:8px;padding:.2em .4em;
}
.controls{
  position:fixed;z-index:3;
  right:calc(16px + env(safe-area-inset-right, 0px));
  bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;
  transition:opacity .5s;
}
.controls.hide{opacity:0;pointer-events:none}
.controls button{
  font:500 14px var(--body);color:var(--night);background:var(--gold);
  border:0;border-radius:999px;padding:10px 18px;cursor:pointer;
}
.controls button.ghost{background:rgba(255,255,255,.12);color:var(--ink)}
.controls button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.hint{
  position:fixed;z-index:3;left:calc(16px + env(safe-area-inset-left, 0px));
  bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  font-size:13px;color:var(--muted);transition:opacity .5s;max-width:46ch
}
.hint.hide{opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-220% 0}}
@media (prefers-reduced-motion:reduce){
  .eyebrow,.hb,.name,.rule{animation:none}
  .wish{transition:none}
}
@media (max-width:600px){.hint{display:none}}

.text{display:flex;flex-direction:column;align-items:center;gap:2.2vh;min-width:0}
.stage{flex-direction:row;gap:5vw}
.portrait{
  margin:0;flex:none;position:relative;
  height:min(58vh,560px);aspect-ratio:256/385;max-width:100%;
  border-radius:999px 999px 28px 28px;padding:8px;
  background:linear-gradient(160deg,var(--gold),var(--coral) 60%,var(--mint));
  box-shadow:0 0 60px rgba(245,196,81,.35),0 20px 60px rgba(0,0,0,.5);
  animation:rise 1.2s .1s both, float 6s ease-in-out 1.4s infinite;
}
.portrait img{width:100%;height:100%;object-fit:cover;display:block;border-radius:999px 999px 22px 22px;max-width:none}
.portrait::after{
  content:"";position:absolute;inset:-18px;border-radius:999px 999px 40px 40px;
  border:2px dashed rgba(245,196,81,.45);animation:spinfade 14s linear infinite;pointer-events:none;
}
.hb{font-size:clamp(46px,8.6vw,170px)}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes spinfade{50%{opacity:.25}}
@media (max-aspect-ratio:1/1){
  .stage{flex-direction:column;gap:2.5vh}
  .portrait{height:min(34vh,380px)}
  .hb{font-size:clamp(44px,12vw,170px)}
}
@media (prefers-reduced-motion:reduce){.portrait,.portrait::after{animation:none}}
</style>

<script>
(function(){
  // ---------- editable text, remembered on this screen ----------
  const nameEl=document.getElementById('name'), fromEl=document.getElementById('from');
  function load(k,el){try{const v=localStorage.getItem(k);if(v)el.textContent=v}catch(e){}}
  function save(k,el){el.addEventListener('input',()=>{try{localStorage.setItem(k,el.textContent.trim())}catch(e){}})
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}})}
  load('bb-name',nameEl);load('bb-from',fromEl);save('bb-name',nameEl);save('bb-from',fromEl);

  // ---------- rotating wishes ----------
  const wishes=[
    "Thank you for leading with vision and heart.",
    "Another year of wisdom, wins and big ideas.",
    "Wishing you good health, joy and peace all year long.",
    "May this new year bring even greater success.",
    "Here's to more milestones together.",
    "Grateful for a leader who believes in us.",
    "Cheers to you, today and always!"
  ];
  const wishEl=document.getElementById('wish');let wi=0;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  setInterval(()=>{
    wi=(wi+1)%wishes.length;
    if(reduce){wishEl.textContent=wishes[wi];return}
    wishEl.classList.add('out');
    setTimeout(()=>{wishEl.textContent=wishes[wi];wishEl.classList.remove('out')},900);
  },6500);

  // ---------- canvas: balloons, sparkles, fireworks ----------
  const cv=document.getElementById('sky'),cx=cv.getContext('2d');
  let W,H,DPR;
  function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
  size();addEventListener('resize',size);
  const palette=['#f5c451','#ff6b6b','#5ee6c8','#b18cff','#ff9ecf','#7fb8ff'];
  const rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0];

  const stars=Array.from({length:120},()=>({x:Math.random(),y:Math.random(),r:rnd(.4,1.6),p:rnd(0,6.28)}));
  const balloons=[];
  function newBalloon(init){const r=rnd(22,46)*(W<700?.6:1);
    return {x:rnd(0,W),y:init?rnd(H*.2,H+200):H+r*3,r,c:pick(palette),v:rnd(.25,.7),sw:rnd(0,6.28),sa:rnd(.3,1)}}
  const bCount=W<700?8:16;for(let i=0;i<bCount;i++)balloons.push(newBalloon(true));
  const sparks=[];const confetti=[];

  function firework(x,y){
    const c=pick(palette),n=70;
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2,s=rnd(2,5.5);
      sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,c:Math.random()<.2?'#fff':c})}
  }
  function confettiRain(){for(let i=0;i<120;i++)confetti.push({x:rnd(0,W),y:rnd(-H*.5,-10),vx:rnd(-.6,.6),vy:rnd(1.2,2.8),r:rnd(0,6.28),vr:rnd(-.15,.15),w:rnd(6,12),h:rnd(3,6),c:pick(palette)})}

  function drawBalloon(b,t){
    const x=b.x+Math.sin(t*.0008+b.sw)*14*b.sa,y=b.y;
    cx.strokeStyle='rgba(255,255,255,.35)';cx.lineWidth=1;cx.beginPath();cx.moveTo(x,y+b.r*1.15);
    cx.quadraticCurveTo(x+Math.sin(t*.002+b.sw)*10,y+b.r*2,x,y+b.r*3);cx.stroke();
    const g=cx.createRadialGradient(x-b.r*.35,y-b.r*.4,b.r*.1,x,y,b.r*1.2);
    g.addColorStop(0,'rgba(255,255,255,.85)');g.addColorStop(.25,b.c);g.addColorStop(1,b.c+'99');
    cx.fillStyle=g;cx.beginPath();cx.ellipse(x,y,b.r*.86,b.r,0,0,Math.PI*2);cx.fill();
    cx.fillStyle=b.c;cx.beginPath();cx.moveTo(x-4,y+b.r+4);cx.lineTo(x+4,y+b.r+4);cx.lineTo(x,y+b.r-2);cx.fill();
  }

  let last=0,nextFw=1500;
  function frame(t){
    const dt=Math.min(t-last,50);last=t;
    cx.clearRect(0,0,W,H);
    for(const s of stars){cx.globalAlpha=.25+.55*Math.abs(Math.sin(t*.001+s.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x*W,s.y*H*.75,s.r,0,6.28);cx.fill()}
    cx.globalAlpha=1;
    for(let i=0;i<balloons.length;i++){const b=balloons[i];b.y-=b.v*dt*.06;drawBalloon(b,t);if(b.y<-b.r*4)balloons[i]=newBalloon(false)}
    cx.globalCompositeOperation='lighter';
    for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.vx*=.985;p.vy*=.985;p.life-=.011;
      if(p.life<=0){sparks.splice(i,1);continue}cx.globalAlpha=p.life;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2.2,0,6.28);cx.fill()}
    cx.globalCompositeOperation='source-over';
    for(let i=confetti.length-1;i>=0;i--){const c=confetti[i];c.x+=c.vx+Math.sin(t*.002+i)*.4;c.y+=c.vy;c.r+=c.vr;
      if(c.y>H+20){confetti.splice(i,1);continue}cx.globalAlpha=1;cx.save();cx.translate(c.x,c.y);cx.rotate(c.r);cx.fillStyle=c.c;cx.fillRect(-c.w/2,-c.h/2,c.w,c.h*Math.abs(Math.cos(c.r)));cx.restore()}
    cx.globalAlpha=1;
    nextFw-=dt;if(nextFw<=0){firework(rnd(W*.1,W*.9),rnd(H*.1,H*.4));nextFw=rnd(2200,4200);if(Math.random()<.18)confettiRain()}
    requestAnimationFrame(frame);
  }
  if(reduce){ // still frame
    cx.fillStyle='#fff';for(const s of stars){cx.globalAlpha=.6;cx.beginPath();cx.arc(s.x*W,s.y*H*.75,s.r,0,6.28);cx.fill()}
    cx.globalAlpha=1;balloons.forEach(b=>drawBalloon(b,0));
  } else {setTimeout(confettiRain,600);requestAnimationFrame(frame)}

  // ---------- controls ----------
  const fsBtn=document.getElementById('fs'),ctr=document.getElementById('controls'),hint=document.getElementById('hint');
  document.getElementById('burst').addEventListener('click',()=>{for(let i=0;i<4;i++)setTimeout(()=>firework(rnd(W*.15,W*.85),rnd(H*.12,H*.45)),i*280);confettiRain()});
  fsBtn.addEventListener('click',async()=>{
    try{ if(document.fullscreenElement)await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }catch(e){fsBtn.textContent='Use the TV browser’s fullscreen'}
  });
  document.addEventListener('fullscreenchange',()=>{fsBtn.textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen'});
  // keep the screen awake
  let lock=null;async function wake(){try{lock=await navigator.wakeLock.request('screen')}catch(e){}}
  wake();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});
  // auto-hide controls when idle
  let idle;function poke(){ctr.classList.remove('hide');clearTimeout(idle);idle=setTimeout(()=>{ctr.classList.add('hide');hint.classList.add('hide')},4000)}
  ['mousemove','keydown','touchstart'].forEach(e=>addEventListener(e,poke,{passive:true}));poke();
})();
</script>
